name: CI/CD Pipeline - Quality Assurance

# Triggers del pipeline
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:  # Permite ejecución manual

# Variables de entorno globales
env:
  JAVA_VERSION: '17'
  MAVEN_OPTS: '-Xmx1024m'
  
jobs:
  # JOB 1: Compilación y Validación
  build-and-validate:
    name: Build & Validate
    runs-on: ubuntu-latest
    
    steps:
      # 1. Checkout del código
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Necesario para análisis histórico
      
      # 2. Configuración de Java
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'
      
      # 3. Verificación de la versión de herramientas
      - name: Display build environment
        run: |
          echo "Java Version:"
          java -version
          echo "Maven Version:"
          mvn -version
          echo "Working Directory:"
          pwd
          echo "Project Structure:"
          ls -la
      
      # 4. Compilación del proyecto
      - name: Compile project
        run: mvn clean compile -B
        continue-on-error: false
      
      # 5. Ejecución de Checkstyle
      - name: Run Checkstyle analysis
        run: mvn checkstyle:checkstyle -B
        continue-on-error: true
      
      # 6. Guardar reporte de Checkstyle
      - name: Upload Checkstyle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkstyle-report
          path: target/checkstyle-result.xml
          retention-days: 30
      
      # 7. Ejecución de PMD
      - name: Run PMD analysis
        run: mvn pmd:pmd -B
        continue-on-error: true
      
      # 8. Guardar reporte de PMD
      - name: Upload PMD report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pmd-report
          path: target/pmd.xml
          retention-days: 30
      
      # 9. Ejecución de CPD (Copy-Paste Detector)
      - name: Run CPD analysis
        run: mvn pmd:cpd -B
        continue-on-error: true
      
      # 10. Guardar reporte de CPD
      - name: Upload CPD report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpd-report
          path: target/cpd.xml
          retention-days: 30

  # JOB 2: Pruebas Unitarias y Cobertura
  test-and-coverage:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    needs: build-and-validate
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'
      
      # 11. Ejecución de pruebas unitarias con JaCoCo
      - name: Run unit tests with coverage
        run: mvn clean test -B
        continue-on-error: false
      
      # 12. Generar reporte de cobertura
      - name: Generate JaCoCo coverage report
        run: mvn jacoco:report -B
      
      # 13. Guardar reportes de pruebas
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            target/surefire-reports/**/*
            target/site/jacoco/**/*
          retention-days: 30
      
      # 14. Verificar cobertura mínima (80%)
      - name: Check coverage threshold
        run: |
          echo "Checking code coverage..."
          mvn jacoco:check -Drules.coverage=0.80 -B || echo "WARNING: Coverage below 80%"
        continue-on-error: true
      
      # 15. Publicar reporte de cobertura en PR
      - name: Add coverage comment to PR
        if: github.event_name == 'pull_request'
        uses: madrapps/jacoco-report@v1.6.1
        with:
          paths: target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 80
          min-coverage-changed-files: 80
          title: 'Code Coverage Report'

  # JOB 3: Análisis de Calidad y Reportes
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [build-and-validate, test-and-coverage]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'
      
      # 16. Descargar todos los reportes
      - name: Download all reports
        uses: actions/download-artifact@v4
        with:
          path: ./reports
      
      # 17. Generar reporte consolidado
      - name: Generate quality report
        run: |
          echo "========================================" > quality-report.txt
          echo "REPORTE DE CALIDAD DE CÓDIGO" >> quality-report.txt
          echo "Fecha: $(date)" >> quality-report.txt
          echo "Commit: ${{ github.sha }}" >> quality-report.txt
          echo "========================================" >> quality-report.txt
          echo "" >> quality-report.txt
          
          echo "METRICAS DE CALIDAD:" >> quality-report.txt
          echo "" >> quality-report.txt
          
          # Contar tests ejecutados
          TEST_COUNT=$(find target/surefire-reports -name "TEST-*.xml" 2>/dev/null | wc -l)
          echo "[OK] Tests ejecutados: $TEST_COUNT" >> quality-report.txt
          
          # Verificar existencia de reportes
          if [ -f "target/checkstyle-result.xml" ]; then
            echo "[OK] Checkstyle: Ejecutado" >> quality-report.txt
          else
            echo "[WARNING] Checkstyle: No disponible" >> quality-report.txt
          fi
          
          if [ -f "target/pmd.xml" ]; then
            echo "[OK] PMD: Ejecutado" >> quality-report.txt
          else
            echo "[WARNING] PMD: No disponible" >> quality-report.txt
          fi
          
          if [ -f "target/site/jacoco/index.html" ]; then
            echo "[OK] JaCoCo: Ejecutado" >> quality-report.txt
          else
            echo "[WARNING] JaCoCo: No disponible" >> quality-report.txt
          fi
          
          echo "" >> quality-report.txt
          echo "========================================" >> quality-report.txt
          echo "ESTADO: Pipeline completado" >> quality-report.txt
          echo "========================================" >> quality-report.txt
          
          cat quality-report.txt
      
      # 18. Ejecutar verificación completa
      - name: Run full verification
        run: mvn verify -B
        continue-on-error: false
      
      # 19. Generar sitio con todos los reportes
      - name: Generate Maven site
        run: mvn site -B
        continue-on-error: true
      
      # 20. Guardar reporte de calidad
      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-report
          path: |
            quality-report.txt
            target/site/**/*
          retention-days: 30
      
      # 21. Verificación final - Quality Gate
      - name: Quality Gate Check
        run: |
          echo "Verificando Quality Gate..."
          
          # Verificar que existan los archivos necesarios
          FAILURES=0
          
          # 1. Compilación exitosa (ya verificado en job anterior)
          echo "[OK] Compilacion: OK"
          
          # 2. Tests ejecutados
          if [ -d "target/surefire-reports" ]; then
            TEST_COUNT=$(find target/surefire-reports -name "TEST-*.xml" 2>/dev/null | wc -l)
            if [ $TEST_COUNT -gt 0 ]; then
              echo "[OK] Tests: $TEST_COUNT archivos encontrados"
            else
              echo "[FAIL] Tests: No se encontraron resultados"
              FAILURES=$((FAILURES + 1))
            fi
          else
            echo "[FAIL] Tests: Directorio no encontrado"
            FAILURES=$((FAILURES + 1))
          fi
          
          # 3. Checkstyle ejecutado
          if [ -f "target/checkstyle-result.xml" ]; then
            echo "[OK] Checkstyle: Ejecutado"
          else
            echo "[WARNING] Checkstyle: No ejecutado (warning)"
          fi
          
          # 4. PMD ejecutado
          if [ -f "target/pmd.xml" ]; then
            echo "[OK] PMD: Ejecutado"
          else
            echo "[WARNING] PMD: No ejecutado (warning)"
          fi
          
          # 5. JaCoCo ejecutado
          if [ -f "target/site/jacoco/jacoco.xml" ]; then
            echo "[OK] JaCoCo: Ejecutado"
          else
            echo "[WARNING] JaCoCo: No ejecutado (warning)"
          fi
          
          echo ""
          echo "========================================="
          if [ $FAILURES -eq 0 ]; then
            echo "[PASSED] QUALITY GATE: PASSED"
            echo "========================================="
            exit 0
          else
            echo "[FAILED] QUALITY GATE: FAILED"
            echo "Fallos detectados: $FAILURES"
            echo "========================================="
            exit 1
          fi

  # JOB 4: Resumen y Notificación
  summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [build-and-validate, test-and-coverage, quality-gate]
    if: always()
    
    steps:
      - name: Generate pipeline summary
        run: |
          echo "# Pipeline Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Job Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build & Validate | ${{ needs.build-and-validate.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests & Coverage | ${{ needs.test-and-coverage.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Quality Gate | ${{ needs.quality-gate.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Execution Details" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Workflow**: ${{ github.workflow }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Artifacts Generated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Checkstyle Report" >> $GITHUB_STEP_SUMMARY
          echo "- PMD Report" >> $GITHUB_STEP_SUMMARY
          echo "- CPD Report" >> $GITHUB_STEP_SUMMARY
          echo "- Test Results" >> $GITHUB_STEP_SUMMARY
          echo "- Coverage Report (JaCoCo)" >> $GITHUB_STEP_SUMMARY
          echo "- Quality Gate Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.quality-gate.result }}" == "success" ]; then
            echo "## Quality Gate: PASSED" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "All quality checks have passed successfully!" >> $GITHUB_STEP_SUMMARY
          else
            echo "## Quality Gate: FAILED" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Some quality checks have failed. Please review the reports." >> $GITHUB_STEP_SUMMARY
          fi
